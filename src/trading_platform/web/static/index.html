<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trading Platform &mdash; real-time monitor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <!--
    Single page of the monitoring dashboard (layer 7).

    It loads exactly two local assets: /static/styles.css and /static/app.js.
    No remote resource, no downloaded font, no build step: the page works
    offline, served by the project's standard-library server.

    data-refresh-seconds="2" documents the polling cadence applied by app.js
    (the REFRESH_MS constant): the transport is plain HTTP, there is no
    WebSocket and no server push.
  -->
  <body data-refresh-seconds="2">
    <header class="topbar">
      <div class="brand">
        <h1>Trading Platform</h1>
        <p class="muted">Real-time multi-profile monitoring</p>
      </div>

      <div class="platform" aria-live="polite">
        <span id="platform-status" class="badge badge-unknown">unknown</span>
        <span class="muted">version <span id="platform-version">&mdash;</span></span>
        <span class="muted"
          >profiles running <span id="profiles-running">0</span> /
          <span id="profiles-total">0</span></span
        >
        <span class="muted">checked <span id="checked-at">&mdash;</span></span>
      </div>

      <div class="kill-switch">
        <label for="operator-token">Operator token</label>
        <input
          id="operator-token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="X-Operator-Token"
        />
        <button id="kill-engage" type="button" class="danger">Emergency stop</button>
        <button id="kill-release" type="button">Resume</button>
        <span id="kill-message" class="muted" role="status" aria-live="polite"></span>
      </div>
    </header>

    <p id="banner" class="banner hidden" role="alert"></p>

    <main id="profiles" class="profiles">
      <p class="muted placeholder">Loading profiles&hellip;</p>
    </main>

    <footer class="footer muted">
      HTTP polling every 2&nbsp;seconds &middot; read-only by default &middot; a
      local-network monitoring surface
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
