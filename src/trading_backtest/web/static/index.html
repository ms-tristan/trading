<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trading-backtest &mdash; suivi temps r&eacute;el</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <!--
    Page unique du tableau de bord de supervision (couche 7).

    Elle ne charge QUE deux ressources locales : /static/styles.css et
    /static/app.js. Aucune ressource distante, aucune police telechargee, aucun outil de build :
    la page fonctionne hors ligne, servie par le serveur standard du projet.

    data-refresh-seconds="2" documente la cadence de sondage appliquee par
    app.js (constante REFRESH_MS) : le transport est du HTTP simple, il n'y a
    ni WebSocket ni poussee serveur.
  -->
  <body data-refresh-seconds="2">
    <header class="topbar">
      <div class="brand">
        <h1>trading-backtest</h1>
        <p class="muted">Supervision multi-profils en temps r&eacute;el</p>
      </div>

      <div class="platform" aria-live="polite">
        <span id="platform-status" class="badge badge-unknown">inconnu</span>
        <span class="muted">version <span id="platform-version">&mdash;</span></span>
        <span class="muted"
          >profils actifs <span id="profiles-running">0</span> /
          <span id="profiles-total">0</span></span
        >
        <span class="muted">contr&ocirc;le <span id="checked-at">&mdash;</span></span>
      </div>

      <div class="kill-switch">
        <label for="operator-token">Jeton op&eacute;rateur</label>
        <input
          id="operator-token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="X-Operator-Token"
        />
        <button id="kill-engage" type="button" class="danger">Arr&ecirc;t d&rsquo;urgence</button>
        <button id="kill-release" type="button">Reprendre</button>
        <span id="kill-message" class="muted" role="status" aria-live="polite"></span>
      </div>
    </header>

    <p id="banner" class="banner hidden" role="alert"></p>

    <main id="profiles" class="profiles">
      <p class="muted">Chargement des profils&hellip;</p>
    </main>

    <footer class="footer muted">
      Sondage HTTP toutes les 2&nbsp;secondes &middot; lecture seule par
      d&eacute;faut &middot; surface de supervision de r&eacute;seau local
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
