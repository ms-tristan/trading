# ===========================================================================
# nginx — tristeubadingview.duckdns.org
# ===========================================================================
#
# The public entry point of this project: TLS termination, HTTP Basic
# authentication, rate limiting and the reverse proxy to the dashboard.
#
# SNAPSHOT of the live host configuration, taken 2026-09-27 from
#     /opt/homebrew/etc/nginx/nginx.conf
# supplemented by
#     /etc/pf.anchors/ally-lima                       (the public port redirect)
#     /opt/homebrew/etc/letsencrypt/live/...          (the Let's Encrypt cert)
#
# This file is NOT an include and is never loaded by nginx as-is: the host runs
# ONE monolithic configuration, and the blocks below belong to two different
# contexts of it (`http` for blocks 1-3, `stream` for block 4). They are
# reproduced verbatim -- host indentation included -- so the reverse proxy, the
# TLS termination and the domain name of this project survive a repository
# reset and can be re-applied on a fresh host.
#
# TO RESTORE
#   1. append blocks 1-3 inside the existing `http { ... }` block;
#   2. keep block 4 inside the existing `stream { ... }` block -- it is shared
#      with the other local TLS vhosts, only its `default` route concerns this
#      project;
#   3. keep the two `rdr` lines of the PORT CHAIN section in
#      /etc/pf.anchors/ally-lima -- and make sure the host config still defines
#      `map $http_upgrade $connection_upgrade`, which block 3's
#      `proxy_set_header Connection` relies on (it is a few lines above
#      `limit_req_zone` in the host file, shared by every vhost);
#   4. `nginx -t` then `nginx -s reload` (a timestamped
#      `nginx.conf.bak-trading-<ts>` backup was written before every change).
#
# ===========================================================================
# PORT CHAIN (public request -> container)
# ===========================================================================
#
#   80/tcp   --pf-->  127.0.0.1:8088   block 2: ACME challenge, then 301 HTTPS
#   443/tcp  --pf-->  127.0.0.1:8445   block 4: `stream`, ssl_preread on SNI
#                          |
#                          v  proxy_protocol on (`$tls_upstream` default)
#                    127.0.0.1:8446   block 3: the TLS vhost (cert, auth, proxy)
#                          |
#                          v  proxy_pass http://trading_dashboard
#                    127.0.0.1:3031   `trading-dashboard` container (Next.js)
#                          |
#                          v  next.config.ts rewrites /api/:path* -> API_ORIGIN
#                    trading-realtime:8080 (compose network)
#
# Nothing but nginx is ever reachable from the public interface: both
# containers publish their port on 127.0.0.1 only (3031 dashboard, 3030
# realtime -- the latter for local debugging, it is NOT an upstream).
#
# ===========================================================================


# ---------------------------------------------------------------------------
# BLOCK 1 -- `http` context: the per-IP rate-limit zone and the upstream
# ---------------------------------------------------------------------------
# nginx talks to the DASHBOARD only. The dashboard proxies /api/* to
# `http://trading-realtime:8080` over the compose network, so the Python port
# is never an upstream and never needs to be one.
  limit_req_zone $binary_remote_addr zone=trading_per_ip:10m rate=100r/s;
  upstream trading_dashboard {
    server 127.0.0.1:3031;
    keepalive 16;
  }


# ---------------------------------------------------------------------------
# BLOCK 2 -- `http` context: the port-80 vhost (ACME + redirect to HTTPS)
# ---------------------------------------------------------------------------
# Reached as 80/tcp via the PF redirect to 8088. DuckDNS resolves
# `tristeubadingview.duckdns.org` to the public IP of this machine; this vhost
# is what makes `certbot --webroot` able to answer the HTTP-01 challenge.
  server {
    listen 8088;
    server_name tristeubadingview.duckdns.org;

    location /.well-known/acme-challenge/ {
      root /opt/homebrew/var/www/certbot;
      try_files $uri =404;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }


# ---------------------------------------------------------------------------
# BLOCK 3 -- `http` context: the TLS vhost on 8446
# ---------------------------------------------------------------------------
# `listen 8446 ssl proxy_protocol` -- the connection always arrives from the
# `stream` block below, so the real client IP comes from the PROXY header, not
# from the socket. Security headers, `auth_basic` and `limit_req` all live
# here; there is no WebSocket upgrade to support (updates are documented
# polling), and no CORS header is ever needed: the browser only ever calls its
# own origin, `/api/*` included.
  # ----- tristeubadingview (tableau de bord temps reel) -----
  server {
    listen 8446 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    http2 on;
    server_name tristeubadingview.duckdns.org;

    ssl_certificate /opt/homebrew/etc/letsencrypt/live/tristeubadingview.duckdns.org/fullchain.pem;
    ssl_certificate_key /opt/homebrew/etc/letsencrypt/live/tristeubadingview.duckdns.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:trading_tls:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    auth_basic "Trading";
    auth_basic_user_file /opt/homebrew/etc/nginx/trading.htpasswd;
    limit_req zone=trading_per_ip burst=100 nodelay;
    limit_req_status 429;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_pass http://trading_dashboard;
    }
  }


# ---------------------------------------------------------------------------
# BLOCK 4 -- `stream` context: SNI routing, public 8445 -> local 8446
# ---------------------------------------------------------------------------
# Shared with the other TLS vhosts of this machine (culia, tristeub, avosign):
# only the `default` route concerns this project. The two `ally.ovh` /`dsh`
# routes are reproduced because they are part of the same block, not because
# this project needs them.
stream {
  map $ssl_preread_server_name $tls_upstream {
    ~(^|\.)ally\.ovh$ 127.0.0.1:9444;          # ingress K3s via PROXY-strip relay (9444 -> 9443)
    ~(^|\.)dsh\.88\.182\.118\.67\.sslip\.io$ 127.0.0.1:1;  # dsh sslip.io retiré 2026-08-20 (port fermé → refus net)
    default          127.0.0.1:8446;           # vhosts TLS locaux (nginx natif, PROXY protocol)
  }

  server {
    listen 8445;
    proxy_pass $tls_upstream;
    proxy_protocol on;
    ssl_preread on;
  }

  # ally.ovh -> K3s ingress : strip PROXY protocol (l'ingress ne l'attend pas)
  server {
    listen 127.0.0.1:9444 proxy_protocol;
    proxy_pass 127.0.0.1:9443;
  }
}


# ---------------------------------------------------------------------------
# PORT CHAIN -- the public redirect (`/etc/pf.anchors/ally-lima`)
# ---------------------------------------------------------------------------
#   rdr pass inet proto tcp from any to any port 80  -> 127.0.0.1 port 8088
#   rdr pass inet proto tcp from any to any port 443 -> 127.0.0.1 port 8445
#
# Two lines, loaded by the `rdr-anchor "com.apple/*"` of /etc/pf.conf. Without
# them nginx listens on 8088/8445 and the public ports reach nothing.


# ---------------------------------------------------------------------------
# CERTIFICATE (Let's Encrypt, webroot / HTTP-01)
# ---------------------------------------------------------------------------
#   /opt/homebrew/etc/letsencrypt/live/tristeubadingview.duckdns.org/
#       fullchain.pem   the chain served by block 3
#       privkey.pem     its key
#
# Obtained -- and renewed -- by the same method as the other domains:
#
#   certbot certonly --webroot -w /opt/homebrew/var/www/certbot \
#     -d tristeubadingview.duckdns.org \
#     --config-dir /opt/homebrew/etc/letsencrypt \
#     --non-interactive --agree-tos --keep-until-expiring --key-type ecdsa
#
# State at the time of this snapshot: issued 2026-09-18, valid until
# 2026-12-17 09:32:47 GMT. Renewal needs block 2 to stay reachable on port 80.
#
#   certbot certificates --config-dir /opt/homebrew/etc/letsencrypt   # inspect
#   certbot renew --config-dir /opt/homebrew/etc/letsencrypt          # renew
#   nginx -t && nginx -s reload                                       # apply


# ---------------------------------------------------------------------------
# BASIC AUTH
# ---------------------------------------------------------------------------
#   /opt/homebrew/etc/nginx/trading.htpasswd      (mode 600, owned by the user)
#   realm "Trading" -- declared by `auth_basic` in block 3
#
# One shared pair for the whole vhost: this is "trusted network" level, not
# per-user authentication. To add or change the pair:
#
#   htpasswd -c /opt/homebrew/etc/nginx/trading.htpasswd <user>   # recreate
#   htpasswd    /opt/homebrew/etc/nginx/trading.htpasswd <user>   # update
#
# A second, independent barrier sits behind it: the operator token
# (`TB_OPERATOR_TOKEN` in deploy/.env) that the dashboard's kill switch has to
# present. Without it, `POST /api/kill-switch` answers 403 even to an
# authenticated user.


# ---------------------------------------------------------------------------
# FAIL2BAN
# ---------------------------------------------------------------------------
# No dedicated jail: the existing `[nginx-auth]` jail
# (/opt/homebrew/etc/fail2ban/jail.local) watches the WHOLE nginx error log
# with the `nginx-http-auth` filter, so it already covers this vhost
# (`maxretry = 5`, `findtime = 10m`, `bantime = 1h`, banning through the pf
# anchor `com.apple/f2b/nginx-auth`, ports 80 and 443).
#
#   sudo fail2ban-client status nginx-auth
#
# Worth knowing: the daemon currently runs started by hand
# (`fail2ban-server --async`, root) and not by launchd -- the
# /Library/LaunchDaemons/homebrew.mxcl.fail2ban.plist exists with RunAtLoad,
# but `launchctl print system/homebrew.mxcl.fail2ban` answers `not running`.
# That is the pre-existing situation on this machine, shared with the other
# protected vhosts; check the jail is up again after a reboot.


# ---------------------------------------------------------------------------
# OPERATIONS
# ---------------------------------------------------------------------------
#   nginx -t                                    # validate before every reload
#   nginx -s reload                             # apply
#   nginx -T | grep -A5 tristeubadingview       # dump the effective vhost
#   tail -f /opt/homebrew/var/log/nginx/error.log
#   curl -sI https://tristeubadingview.duckdns.org/
#
# Backups written before each change, next to the live file:
#   nginx.conf.bak-trading-<timestamp>
