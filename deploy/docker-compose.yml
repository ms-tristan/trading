# ---------------------------------------------------------------------------
# Local deployment of the real-time multi-profile platform.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f
#   docker compose -f deploy/docker-compose.yml down          # keep the volumes
#
# Two containers:
#   trading-realtime   the Python engine + monitoring JSON API (plain HTTP 8080)
#   trading-dashboard  the Next.js dashboard (plain HTTP 3000); it proxies
#                      /api/* to trading-realtime over the compose network, so
#                      the browser only ever talks to its own origin
#
# Both are published on the loopback interface only (127.0.0.1:3030 and
# 127.0.0.1:3031): TLS, HTTP Basic authentication, rate limiting and fail2ban
# are the host nginx's job (see deploy/README.md). nginx serves the dashboard
# on / and the Python API is published for local debugging only.
#
# Credentials come from deploy/.env (git-ignored, mode 600) and are injected
# through the environment -- the images themselves contain no secret.
#
# Durable state: the profile set and the engine settings live in the SQLite
# state database, at `/app/data/realtime/state.db` inside the `trading-state`
# volume. That database is the single source of truth since the committed JSON
# profile document was removed, so the TWO named volumes below are the only
# durable state the realtime container needs; the operator creates profiles
# through the dashboard, and deleting the volume is the only way to lose them.
# Nothing is bind-mounted from the checkout: no file of this repository is
# written by a container any more.
# ---------------------------------------------------------------------------
services:
  trading-realtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.realtime
    image: trading-realtime:latest
    container_name: trading-realtime
    restart: unless-stopped

    env_file:
      - .env
    environment:
      TB_LOG_LEVEL: INFO
      # Fleet cap: how many Freqtrade workers may run at the same time.
      #
      # A worker costs about 390 MiB RSS (measured: eight workers, 3.13 GiB,
      # linear), so ten of them hold roughly 3.9 GiB inside the Docker VM, on
      # top of the supervisor and the other stacks on this machine. The host has
      # 16 GiB of RAM and the VM is limited to 12 GiB; pushing the fleet higher
      # makes the host swap hard and the VM unresponsive, which is exactly the
      # failure this cap exists to prevent.
      #
      # Ten is also the number that keeps ONE profile of EVERY strategy running
      # at the same time: the catalogue gives the primary profile of each
      # strategy priority 100 and its secondary profile priority 50, and the
      # scheduler starts the highest priorities first. Raise it here -- and only
      # after checking free memory -- to run more profiles concurrently.
      TB_MAX_RUNNING_PROFILES: "10"
      TB_SNAPSHOT_INTERVAL_SECONDS: "60"

    ports:
      - "127.0.0.1:3030:8080"

    volumes:
      # durable state: the SQLite state database (profiles + settings), the
      # kill-switch file and the structured logs. This volume plus the cache one
      # are the ONLY durable state the realtime container needs.
      - trading-state:/app/data/realtime
      # OHLCV cache (survives restarts, avoids re-downloading the warmup window)
      - trading-cache:/app/data/cache

    # the image healthcheck already probes GET /api/health on 8080
    stop_grace_period: 30s

  trading-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      # baked at build time: rewrites() is resolved when next.config.ts is
      # evaluated, so changing the API origin means rebuilding the image
      args:
        API_ORIGIN: "http://trading-realtime:8080"
    image: trading-dashboard:latest
    container_name: trading-dashboard
    restart: unless-stopped

    environment:
      API_ORIGIN: "http://trading-realtime:8080"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"

    # loopback only: nginx terminates TLS and fronts this port (upstream
    # trading_dashboard -> 127.0.0.1:3031)
    ports:
      - "127.0.0.1:3031:3000"

    depends_on:
      - trading-realtime

    # the image healthcheck probes GET / on 3000 with Node's global fetch
    stop_grace_period: 10s

volumes:
  trading-state:
  trading-cache:
