name: CI

# Single quality job on purpose: the Docker image is exercised locally with
# `make docker-test`, so CI stays fast and 100% offline (no exchange API, no
# market-data download, no optional extras).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, tests & coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Dev extra only: the heavy optional extras are never installed here, so
      # the build needs neither TA-Lib nor a live exchange client.
      - name: Install the package (dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Type-check (mypy)
        run: python -m mypy src

      # Exact command from docs/testing-policy.md section 3. The 85% gate comes
      # from pyproject.toml (--cov-fail-under in addopts / fail_under in
      # [tool.coverage.report]), so it is never repeated here.
      - name: Tests & coverage gate
        run: python -m pytest tests --cov=trading_backtest --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
