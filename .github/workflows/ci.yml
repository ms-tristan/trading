name: CI

# Two jobs on purpose: `quality` covers the Python package, `dashboard` covers
# the standalone Next.js monitoring dashboard. The Docker images are exercised
# locally with `make docker-test`, so CI stays fast and 100% offline (no
# exchange API, no market-data download, no optional extras, no live server).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, tests & coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Dev extra only: the heavy optional extras are never installed here, so
      # the build needs neither TA-Lib nor a live exchange client.
      - name: Install the package (dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Type-check (mypy)
        run: python -m mypy src

      # Exact command from docs/testing-policy.md section 3. The 85% gate comes
      # from pyproject.toml (--cov-fail-under in addopts / fail_under in
      # [tool.coverage.report]), so it is never repeated here.
      - name: Tests & coverage gate
        run: python -m pytest tests --cov=trading_platform --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  dashboard:
    name: "Dashboard: lint, type-check, tests & build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The lockfile is committed: `npm ci` is the only supported install, and it
      # brings nothing but the dashboard's own JavaScript dependencies.
      - name: Install the dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint (eslint)
        working-directory: dashboard
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        working-directory: dashboard
        run: npm run typecheck

      # Exact commands from docs/testing-policy.md section 9.3. The coverage gate
      # (85% lines/statements/functions, 75% branches) lives only in
      # dashboard/vitest.config.ts, so it is never repeated here.
      - name: Tests & coverage gate
        working-directory: dashboard
        run: npm run test:coverage

      - name: Production build (next build)
        working-directory: dashboard
        run: npm run build
